<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Forest Coin Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrapper">
    <h1>Forest Coin Adventure</h1>

    <div class="hud">
      <p>Punteggio: <span id="score">0</span></p>
      <p>Record: <span id="highScore">0</span></p>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="controls">
      <p><strong>Controlli:</strong> ← → per muoverti | SPAZIO per saltare | ↑ ↓ per usare le scale | R per ricominciare</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
